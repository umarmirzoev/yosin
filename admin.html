<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кабинет продавца — Yosin Store</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="admin">
<div class="splash-screen" id="splashScreen">
  <div class="splash-logo"><img src="assets/logo.jpg" alt="Yosin Store"></div>
  <div class="splash-word">YOSIN<em>.store</em></div>
  <div class="splash-bar"><span></span></div>
  <div class="splash-text">Загрузка…</div>
</div>

<!-- ============ LOGIN VIEW (shown when not authenticated as Admin) ============ -->
<div id="adminLoginScreen" class="admin-login-wrap">
  <section id="adminLoginView" class="admin-login-card">
    <span data-icon="user" data-size="26" style="color:var(--gold-deep);margin-bottom:10px;"></span>
    <h3 style="margin-bottom:6px;">Вход для администратора</h3>
    <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 20px;">Введите номер телефона и пароль администратора.</p>
    <form id="loginForm">
      <div class="field" style="margin-bottom:12px;">
        <label>Номер телефона</label>
        <input type="text" name="phone" placeholder="+992 90 000-00-00" required autocomplete="username">
      </div>
      <div class="field" style="margin-bottom:6px;">
        <label>Пароль</label>
        <input type="password" name="password" required autocomplete="current-password">
      </div>
      <p id="loginError" class="admin-error" hidden></p>
      <button type="submit" class="btn btn-gold btn-block" style="margin-top:14px;">Войти</button>
    </form>
    <p style="font-size:11.5px;color:var(--ink-faint);margin-top:16px;">
      <a href="index.html" style="color:var(--ink-faint);">&larr; Вернуться в магазин</a>
    </p>
  </section>
</div>

<!-- ============ DASHBOARD APP (shown when authenticated as Admin) ============ -->
<div id="adminApp" class="admin-app" hidden>
  <div class="drawer-overlay" id="sidebarOverlay" hidden></div>
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-sidebar-brand">
      <img src="assets/logo.jpg" alt="Yosin">
      <span>YOSIN admin</span>
    </div>
    <nav id="adminNav">
      <div class="admin-nav-group active open" data-group="dashboard">
        <button type="button" class="admin-nav-head" data-view="dashboard">
          <span data-icon="grid" data-size="17"></span> Дашборд
        </button>
      </div>
      <div class="admin-nav-group" data-group="orders">
        <button type="button" class="admin-nav-head" data-toggle-group="orders">
          <span data-icon="clipboard" data-size="17"></span> Заказы <span class="chev" data-icon="chevronDown" data-size="14"></span>
        </button>
        <ul class="admin-nav-sub">
          <li><button type="button" class="active" data-view="orders" data-order-filter="">Все заказы</button></li>
          <li><button type="button" data-view="orders" data-order-filter="New">Новые</button></li>
          <li><button type="button" data-view="orders" data-order-filter="Processing">В обработке</button></li>
          <li><button type="button" data-view="orders" data-order-filter="Shipped">Отправлено</button></li>
          <li><button type="button" data-view="orders" data-order-filter="Delivered">Доставлено</button></li>
          <li><button type="button" data-view="orders" data-order-filter="Cancelled">Отменено</button></li>
        </ul>
      </div>
      <div class="admin-nav-group" data-group="products">
        <button type="button" class="admin-nav-head" data-toggle-group="products">
          <span data-icon="box" data-size="17"></span> Товары <span class="chev" data-icon="chevronDown" data-size="14"></span>
        </button>
        <ul class="admin-nav-sub">
          <li><button type="button" class="active" data-view="products">Все товары</button></li>
          <li><button type="button" data-view="products" data-product-filter="low">Низкий остаток</button></li>
        </ul>
      </div>
      <div class="admin-nav-group" data-group="customers">
        <button type="button" class="admin-nav-head" data-view="customers">
          <span data-icon="user" data-size="17"></span> Клиенты
        </button>
      </div>
      <div class="admin-nav-group" data-group="finance">
        <button type="button" class="admin-nav-head" data-view="finance">
          <span data-icon="wallet" data-size="17"></span> Финансы
        </button>
      </div>
    </nav>
    <div class="admin-sidebar-foot">
      <button type="button" class="admin-nav-head" id="logoutBtn">
        <span data-icon="logout" data-size="17"></span> Выйти
      </button>
    </div>
  </aside>

  <div style="flex:1;min-width:0;">
    <header class="admin-topbar">
      <button type="button" class="admin-icon-btn" id="sidebarToggle" style="display:none;" aria-label="Меню">
        <span data-icon="menu" data-size="18"></span>
      </button>
      <h1 id="viewTitle">Дашборд</h1>
      <div class="admin-topbar-search">
        <span data-icon="search" data-size="16"></span>
        <input type="text" id="globalSearch" placeholder="Поиск по заказам, товарам, клиентам…">
      </div>
      <div class="admin-topbar-actions">
        <button type="button" class="admin-icon-btn" id="refreshBtn" aria-label="Обновить">
          <span data-icon="refresh" data-size="17"></span>
        </button>
        <div class="admin-profile-chip">
          <div class="admin-profile-avatar" id="adminAvatar">A</div>
          <div>
            <div class="name" id="adminName">Admin</div>
            <div class="role">Администратор</div>
          </div>
        </div>
      </div>
    </header>

    <main class="admin-content">
      <p id="adminLoadError" class="admin-error" hidden></p>

      <!-- ---------- DASHBOARD ---------- -->
      <section class="admin-view active" id="view-dashboard">
        <div class="admin-stat-cards" id="statCards"></div>
        <div class="admin-card" id="revenueCard" style="margin-bottom:16px;"></div>
        <div class="admin-grid-2">
          <div class="admin-card">
            <div class="admin-card-head"><h3>Последние заказы</h3><button type="button" class="link-btn" data-view="orders" data-order-filter="">Все заказы</button></div>
            <div id="recentOrdersTable"></div>
          </div>
          <div class="admin-card">
            <div class="admin-card-head"><h3>Товары на исходе</h3><button type="button" class="link-btn" data-view="products" data-product-filter="low">Все товары</button></div>
            <div id="lowStockList"></div>
          </div>
        </div>
      </section>

      <!-- ---------- ORDERS ---------- -->
      <section class="admin-view" id="view-orders">
        <div class="admin-filter-tabs" id="orderFilterTabs">
          <button type="button" class="admin-filter-tab active" data-status="">Все</button>
          <button type="button" class="admin-filter-tab" data-status="New">Новые</button>
          <button type="button" class="admin-filter-tab" data-status="Processing">В обработке</button>
          <button type="button" class="admin-filter-tab" data-status="Shipped">Отправлено</button>
          <button type="button" class="admin-filter-tab" data-status="Delivered">Доставлено</button>
          <button type="button" class="admin-filter-tab" data-status="Cancelled">Отменено</button>
        </div>
        <div class="admin-card"><div id="ordersTable"></div></div>
      </section>

      <!-- ---------- PRODUCTS ---------- -->
      <section class="admin-view" id="view-products">
        <div style="display:flex;justify-content:flex-end;margin-bottom:14px;">
          <button type="button" class="btn btn-gold" id="addProductBtn">+ Добавить товар</button>
        </div>
        <div class="admin-table" id="productsTable"></div>
      </section>

      <!-- ---------- CUSTOMERS ---------- -->
      <section class="admin-view" id="view-customers">
        <div class="admin-card"><div id="customersTable"></div></div>
      </section>

      <!-- ---------- FINANCE ---------- -->
      <section class="admin-view" id="view-finance">
        <div class="admin-stat-cards" id="financeCards" style="grid-template-columns:repeat(3,1fr);"></div>
        <div class="admin-card">
          <div class="admin-card-head">
            <h3>Расходы по товарам</h3>
            <button type="button" class="link-btn" id="addExpenseBtn">+ Добавить расход</button>
          </div>
          <div id="expensesTable"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<!-- Product modal (add/edit) -->
<div class="admin-modal" id="productModal" hidden>
  <div class="admin-modal-card">
    <div class="admin-modal-head">
      <h3 id="productModalTitle">Добавить товар</h3>
      <button type="button" class="admin-modal-close" id="closeProductModal" aria-label="Закрыть">&times;</button>
    </div>
    <form id="productForm">
      <input type="hidden" name="id">
      <div class="field" style="margin-bottom:12px;">
        <label>Название</label>
        <input name="name" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Slug (латиницей, без пробелов)</label>
        <input name="slug" required>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Описание</label>
        <textarea name="description" rows="3"></textarea>
      </div>
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="field"><label>Цена, смн</label><input type="number" name="price" required min="0" step="0.01"></div>
        <div class="field"><label>Старая цена (если скидка)</label><input type="number" name="oldPrice" min="0" step="0.01"></div>
        <div class="field"><label>Себестоимость</label><input type="number" name="costPrice" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Остаток, шт</label><input type="number" name="stock" required min="0" value="0"></div>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Главное фото</label>
        <input type="hidden" name="mainImageUrl">
        <div class="admin-photo-picker">
          <div class="admin-photo-preview" id="mainImagePreview"><span data-icon="box" data-size="22"></span></div>
          <label class="btn btn-ghost admin-photo-btn">
            Выбрать фото
            <input type="file" accept="image/*" id="mainImageInput" hidden>
          </label>
        </div>
        <p id="mainImageStatus" class="admin-photo-status" hidden></p>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Доп. фото (галерея)</label>
        <div class="admin-gallery-grid" id="galleryGrid"></div>
        <label class="btn btn-ghost admin-photo-btn admin-gallery-add">
          + Добавить фото (можно несколько, из галереи)
          <input type="file" accept="image/*" multiple id="galleryInput" hidden>
        </label>
        <p id="galleryStatus" class="admin-photo-status" hidden></p>
      </div>
      <div class="form-grid" style="margin-bottom:12px;">
        <div class="field"><label>Доступные цвета</label><input name="availableColors" placeholder="Чёрный, Белый, Золотой"></div>
        <div class="field"><label>Память / объём</label><input name="storageOptions" placeholder="128GB, 256GB, 512GB"></div>
      </div>
      <div class="form-grid" style="margin-bottom:6px;">
        <div class="field"><label>Категория</label><select name="categoryId" id="categorySelect" required></select></div>
        <div class="field">
          <label>Бренд</label>
          <div style="display:flex;gap:6px;">
            <select name="brandId" id="brandSelect" style="flex:1;"><option value="">—</option></select>
            <button type="button" class="btn btn-ghost" id="addBrandBtn" title="Добавить бренд" style="flex:0 0 auto;padding:0 14px;">+</button>
          </div>
        </div>
      </div>
      <p id="productFormError" class="admin-error" hidden></p>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="button" class="btn btn-ghost btn-block" id="cancelProductBtn">Отмена</button>
        <button type="submit" class="btn btn-gold btn-block" id="saveProductBtn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- Expense modal (add) -->
<div class="admin-modal" id="expenseModal" hidden>
  <div class="admin-modal-card">
    <div class="admin-modal-head">
      <h3>Добавить расход</h3>
      <button type="button" class="admin-modal-close" id="closeExpenseModal" aria-label="Закрыть">&times;</button>
    </div>
    <form id="expenseForm">
      <div class="field" style="margin-bottom:12px;">
        <label>Товар</label>
        <select name="productId" id="expenseProductSelect" required></select>
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Сумма, смн</label>
        <input type="number" name="amount" required min="0" step="0.01">
      </div>
      <div class="field" style="margin-bottom:12px;">
        <label>Описание</label>
        <input name="description" placeholder="Закупка, доставка, реклама…">
      </div>
      <p id="expenseFormError" class="admin-error" hidden></p>
      <div style="display:flex;gap:10px;margin-top:16px;">
        <button type="button" class="btn btn-ghost btn-block" id="cancelExpenseBtn">Отмена</button>
        <button type="submit" class="btn btn-gold btn-block">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<script src="data/products.js"></script>
<script src="assets/script.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
